<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Select Portal</title>
</head>
<body style="margin:0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="text-align: center; max-width: 700px; width: 90%;">
        <h1 style="color: #2c3e50; font-size: 32px; margin-bottom: 10px;">Welcome to the System</h1>
        <p style="color: #7f8c8d; margin-bottom: 40px;">Please select the portal you wish to access</p>
        
        <div style="display: flex; gap: 25px; justify-content: center; flex-wrap: wrap;">
            
            <a href="{% url 'user_login' %}" style="flex: 1; min-width: 250px; background: white; padding: 50px 30px; border-radius: 15px; text-decoration: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: transform 0.3s, box-shadow 0.3s; border-top: 5px solid #667eea;">
                <div style="font-size: 50px; margin-bottom: 20px;">👤</div>
                <h3 style="margin: 0; color: #667eea; font-size: 20px;">User Portal</h3>
                <p style="color: #95a5a6; font-size: 14px; margin-top: 10px;">Login to check your balance and account details.</p>
            </a>

            <a href="{% url 'staff_login' %}" style="flex: 1; min-width: 250px; background: white; padding: 50px 30px; border-radius: 15px; text-decoration: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: transform 0.3s, box-shadow 0.3s; border-top: 5px solid #2c3e50;">
                <div style="font-size: 50px; margin-bottom: 20px;">🛡️</div>
                <h3 style="margin: 0; color: #2c3e50; font-size: 20px;">Staff Panel</h3>
                <p style="color: #95a5a6; font-size: 14px; margin-top: 10px;">Access administrative tools to manage users and funds.</p>
            </a>

        </div>
    </div>

</body>
</html>
