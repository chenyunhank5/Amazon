<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>User Portal</title>
    <style>
        :root { 
            --primary: #3b82f6; 
            --inactive: #94a3b8; 
            --bg: #f8fafc; 
            --dark: #0f172a; 
            --nav-height: 70px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            margin: 0; 
            background: var(--bg); 
            font-family: -apple-system, system-ui, sans-serif; 
            padding-bottom: 120px; 
            color: var(--dark);
        }

        /* TOP NAV */
        nav { 
            background: white; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-bottom: 1px solid #e2e8f0; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            padding-top: env(safe-area-inset-top, 15px);
        }

        .container { 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            width: 100%;
        }

        .dashboard-card { 
            background: white; 
            width: 100%; 
            max-width: 450px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); 
            border: 1px solid #f1f5f9; 
            padding: 20px;
        }

        /* BOTTOM NAV */
        .bottom-nav { 
            position: fixed; 
            bottom: 25px; 
            left: 15px; 
            right: 15px; 
            height: var(--nav-height); 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-radius: 22px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            z-index: 9999; 
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-decoration: none; 
            color: var(--inactive); 
            font-size: 11px; 
            font-weight: 700; 
            flex: 1; 
            height: 100%;
            justify-content: center;
        }

        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }

        /* THE CENTER BUTTON ADJUSTMENT */
        .nav-item.center-btn {
            position: relative;
            overflow: visible; 
        }

        .nav-item.center-btn .nav-icon { 
            background: var(--primary); 
            color: white; 
            width: 54px; 
            height: 54px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 18px; 
            position: absolute;
            top: -20px; 
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); 
            font-size: 26px;
            border: 4px solid white; 
        }

        .nav-item.center-btn span:last-child {
            margin-top: 38px;
        }

        #message-toast-container {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        width: calc(100% - 40px);
        max-width: 400px;
        pointer-events: none;
        display: flex;
        justify-content: center;
    }

    .toast-item {
        padding: 14px 20px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: slideDownFade 4s ease-in-out forwards;
    }

    @keyframes slideDownFade {
        0% { opacity: 0; transform: translateY(-20px); }
        15% { opacity: 1; transform: translateY(0); }
        85% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
    }

    </style>
</head>
<body>
    <div id="message-toast-container">
    {% if messages %}
        {% for message in messages %}
            {% if forloop.last %}
                <div class="toast-item" style="{% if message.tags == 'error' %} background: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; {% else %} background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; {% endif %}">
                    {{ message }}
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}
</div>

    <nav>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 26px; height: 26px; background: var(--primary); border-radius: 7px;"></div>
            <span style="font-weight: 800; color: var(--dark); letter-spacing: -0.5px;">{% block header_title %}PORTAL{% endblock %}</span>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <div class="bottom-nav">
        <a href="{% url 'user_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'user_dashboard' %}active{% endif %}">
            <span class="nav-icon">🏠</span><span>Home</span>
        </a>
        <a href="{% url 'user_wallet' %}" class="nav-item {% if request.resolver_match.url_name == 'user_wallet' %}active{% endif %}">
            <span class="nav-icon">👛</span><span>Wallet</span>
        </a>
        <a href="{% url 'user_order' %}" class="nav-item center-btn {% if request.resolver_match.url_name == 'user_order' %}active{% endif %}">
            <span class="nav-icon">⚡</span><span>Order</span>
        </a>
        <a href="{% url 'user_record' %}" class="nav-item {% if request.resolver_match.url_name == 'user_record' %}active{% endif %}">
            <span class="nav-icon">📋</span><span>Record</span>
        </a>
        <a href="{% url 'user_settings' %}" class="nav-item {% if request.resolver_match.url_name == 'user_settings' %}active{% endif %}">
            <span class="nav-icon">⚙️</span><span>Settings</span>
        </a>
    </div>

</body>
</html>
