<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Security | Update Credentials</title>
    <style>
        :root { --primary: #3b82f6; --dark: #0f172a; --bg: #f8fafc; --inactive: #94a3b8; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: var(--dark); margin:0; }
        .dashboard-card { background: white; border-radius: 28px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; width: 100%; max-width: 400px; }
        
        /* Tab Styling */
        .tabs-header { display: flex; border-bottom: 1px solid #f1f5f9; background: #fff; }
        .tab-btn { flex: 1; padding: 18px; text-align: center; font-size: 14px; font-weight: 700; color: var(--inactive); border: none; background: none; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .tab-content { display: none; padding: 24px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #475569; }
        form p { margin-bottom: 20px; font-size: 14px; font-weight: 600; color: #475569; } /* For Django password_form.as_p */
        
        input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 16px; margin-bottom: 15px; background: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .pin-input { letter-spacing: 8px; text-align: center; font-size: 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 20px; }
        .submit-btn { width: 100%; padding: 16px; border: none; background: var(--primary); color: white; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }
        
        /* Form error list styling */
        form ul { list-style: none; padding: 0; color: #ef4444; font-size: 12px; margin: -10px 0 10px 0; }
    </style>
</head>
<body>

<div style="width: 100%; max-width: 400px;">
    
    <a href="{% url 'user_settings' %}" class="back-link">← Back to Settings</a>

    <div class="dashboard-card">
        <div class="tabs-header">
            <button class="tab-btn active" id="btn-pass" onclick="switchTab('password-section', 'btn-pass')">Login Password</button>
            <button class="tab-btn" id="btn-pin" onclick="switchTab('pin-section', 'btn-pin')">Withdrawal PIN</button>
        </div>

        {% if messages %}
            <div style="padding: 0 24px; margin-top: 20px;">
                {% for message in messages %}
                    <div style="padding: 12px; border-radius: 12px; font-size: 13px; {% if message.tags == 'error' %}background: #fee2e2; color: #b91c1c;{% else %}background: #dcfce7; color: #16a34a;{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div id="password-section" class="tab-content active">
            <form method="POST">
                {% csrf_token %}
                {{ password_form.as_p }}
                <button type="submit" name="update_password" class="submit-btn">Update Password</button>
            </form>
        </div>

        <div id="pin-section" class="tab-content">
            <h2 style="font-size: 18px; margin: 0 0 10px 0;">Withdrawal PIN</h2>
            <p style="font-size: 13px; color: var(--inactive); margin-bottom: 20px;">Required for all fund transfers.</p>
            
            <form method="POST">
                {% csrf_token %}
                <label>Current PIN</label>
                <input type="password" name="old_pin" class="pin-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required>

                <label>New 6-Digit PIN</label>
                <input type="password" name="new_pin" class="pin-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required>

                <label>Confirm New PIN</label>
                <input type="password" name="confirm_pin" class="pin-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required>

                <button type="submit" name="update_pin" class="submit-btn">Update Withdrawal PIN</button>
            </form>
        </div>

        <div style="padding: 24px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #94a3b8; text-align: center;">
            Contact Customer Service if you forgot your credentials.
        </div>
    </div>
</div>

<script>
    function switchTab(sectionId, btnId) {
        // Hide all sections
        document.querySelectorAll('.tab-content').forEach(section => section.classList.remove('active'));
        // Deactivate all buttons
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        // Show selected section and activate button
        document.getElementById(sectionId).classList.add('active');
        document.getElementById(btnId).classList.add('active');
    }
</script>

</body>
</html>
