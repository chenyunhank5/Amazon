{% extends "users/user_main.html" %}

{% block header_title %}MY WALLET{% endblock %}

{% block content %}
<div style="width: 100%; max-width: 400px; margin: 0 auto;">
    
    <div class="dashboard-card" style="padding: 30px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; margin-bottom: 20px;">
        <div style="font-size: 12px; font-weight: 600; opacity: 0.9; text-transform: uppercase;">Current Balance</div>
        <div style="font-size: 36px; font-weight: 800; margin: 10px 0;">${{ profile.balance }}</div>
        <div style="font-size: 11px; background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 10px; border-radius: 10px;">
            Standard Account
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px;">
        <a href="{% url 'user_settings' %}" style="text-decoration: none; background: white; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #e2e8f0;">
            <div style="font-size: 24px; margin-bottom: 5px;">📥</div>
            <div style="font-size: 12px; font-weight: 800; color: var(--dark);">Deposit</div>
        </a>
        <a href="{% url 'user_settings' %}" style="text-decoration: none; background: white; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #e2e8f0;">
            <div style="font-size: 24px; margin-bottom: 5px;">📤</div>
            <div style="font-size: 12px; font-weight: 800; color: var(--dark);">Withdraw</div>
        </a>
    </div>

    <div class="dashboard-card" style="padding: 20px;">
        <h4 style="margin: 0 0 15px 0; font-size: 13px; color: var(--dark);">Withdrawal Info</h4>
        <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9;">
            <span style="font-size: 12px; color: #64748b;">Daily Limit</span>
            <span style="font-size: 12px; font-weight: 700; color: var(--dark);">$5,000.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 10px 0;">
            <span style="font-size: 12px; color: #64748b;">Fee Rate</span>
            <span style="font-size: 12px; font-weight: 700; color: var(--dark);">0.5%</span>
        </div>
    </div>

</div>
{% endblock %}
