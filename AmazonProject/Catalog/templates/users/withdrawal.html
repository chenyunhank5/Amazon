<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Withdraw Crypto | Portal</title>
    <style>
        :root { --primary: #3b82f6; --inactive: #94a3b8; --bg: #f8fafc; --dark: #0f172a; --nav-height: 70px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); font-family: -apple-system, system-ui, sans-serif; padding-bottom: 120px; color: var(--dark); }

        nav { background: white; padding: 20px; display: flex; justify-content: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        
        input, select { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 17px; margin: 8px 0 16px 0; }
        button { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 18px; font-weight: 800; font-size: 18px; cursor: pointer; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 25px; left: 15px; right: 15px; height: var(--nav-height); background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.15); z-index: 9999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--inactive); font-size: 11px; font-weight: 700; flex: 1; }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
        .center-btn { position: relative; }
        .center-btn .nav-icon { position: absolute; top: -20px; background: var(--primary); color: white; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 18px; border: 4px solid white; font-size: 26px; }
        .center-btn span:last-child { margin-top: 38px; }
    </style>
</head>
<body>

    <nav>
        <span style="font-weight: 800;">WITHDRAWAL</span>
    </nav>

    <main class="container">
        <div style="margin-bottom: 20px;">
            <a href="{% url 'user_wallet' %}" style="text-decoration: none; color: var(--inactive); font-weight: 600; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 20px;">←</span> Back to Wallet
            </a>
        </div>

        <div style="background: white; padding: 24px; border-radius: 28px; border: 1px solid #f1f5f9;">
            <h2 style="margin-top: 0;">Withdraw Crypto</h2>
            <form method="POST">
                {% csrf_token %}
                <label style="font-weight: 600;">Select Network</label>
                <select name="network" required>
                    <option value="USDT_TRC20">USDT (TRC20)</option>
                    <option value="USDT_ERC20">USDT (ERC20)</option>
                    <option value="BTC">Bitcoin (BTC)</option>
                </select>

                <label style="font-weight: 600;">Wallet Address</label>
                <input type="text" name="wallet_address" placeholder="Enter address" required>

                <label style="font-weight: 600;">Amount ($)</label>
                <input type="number" name="amount" placeholder="0.00" required>

                <button type="submit">Confirm Withdrawal</button>
            </form>
        </div>
    </main>

</body>
</html>
