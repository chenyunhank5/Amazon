<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security | Change Password</title>
    <style>
        :root { --primary: #3b82f6; --dark: #0f172a; --bg: #f8fafc; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .dashboard-card { background: white; border-radius: 28px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* Form Styling */
        form p { margin-bottom: 20px; font-size: 14px; font-weight: 600; color: #475569; }
        form input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 16px; margin-top: 8px; background: #fff; box-sizing: border-box; }
        form ul { list-style: none; padding: 0; color: #ef4444; font-size: 12px; margin-top: 5px; }
        
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div style="width: 100%; max-width: 400px;">
    
    <a href="{% url 'user_settings' %}" class="back-link">← Back to Settings</a>

    <div class="dashboard-card" style="padding: 24px;">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 20px;">Change Password</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" style="width: 100%; padding: 16px; border: none; background: var(--primary); color: white; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px;">
                Update Password
            </button>
        </form>
        
        <div style="margin-top: 25px; font-size: 12px; color: #94a3b8; text-align: center;">
            Forgot your old password? <br>
            <a href="#" style="color: var(--primary); font-weight: 700; text-decoration: none;">Contact Customer Service</a>
        </div>
    </div>
</div>

</body>
</html>
