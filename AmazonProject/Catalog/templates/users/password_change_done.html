{% extends "users/user_main.html" %}

{% block header_title %}PASSWORD CHANGED{% endblock %}

{% block content %}
<div class="dashboard-card" style="width: 100%; max-width: 400px; padding: 40px 20px; text-align: center;">
    <div style="font-size: 50px; margin-bottom: 20px;">✅</div>
    <h2 style="color: var(--dark); font-size: 20px; font-weight: 800;">Password Updated</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 30px;">
        Your password has been changed successfully.
    </p>
    
    <a href="{% url 'user_settings' %}" style="display: block; width: 100%; padding: 16px; background: var(--primary); color: white; text-decoration: none; border-radius: 12px; font-weight: 800; font-size: 14px;">
        Back to Settings
    </a>
</div>
{% endblock %}
