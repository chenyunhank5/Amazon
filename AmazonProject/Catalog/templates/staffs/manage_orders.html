<form method="GET" action="{% url 'staffs' %}" style="margin-bottom: 20px;">
    <input type="hidden" name="tab" value="templates">
    
    <div style="display: flex; gap: 8px;">
        <input type="text" name="template_search" placeholder="Search templates..." 
               value="{{ template_search_query }}" 
               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        <button type="submit" class="btn-sm btn-blue">Search</button>
    </div>
</form>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin:0;">Task Templates</h3>
    <a href="{% url 'add_order_staff' %}" class="btn-sm btn-balance">+ Create New Template</a>
</div>

<table>
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Commission %</th>
            <th style="text-align: right;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for o in task_templates %}
        <tr>
            <td>{{ o.product_name }}</td>
            <td>${{ o.price }}</td>
            <td style="color:#3498db; font-weight:bold;">{{ o.commission_rate }}%</td>
            <td style="text-align: right;">
                <a href="{% url 'edit_order_staff' o.id %}" class="btn-sm btn-blue">Edit</a>
                <form action="{% url 'delete_order_staff' o.id %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-sm btn-red" onclick="return confirm('Delete template?')">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4" style="text-align:center; padding: 20px; color:#94a3b8;">No templates found.</td></tr>
        {% endfor %}
    </tbody>
</table>
