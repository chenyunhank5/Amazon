<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User | Staff Panel</title>
    <style>
        body { margin: 0; background: #f0f2f5; font-family: sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; padding: 20px; }
        .container { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:100%; max-width:450px; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        .tab-buttons { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { padding: 10px; cursor: pointer; border: none; background: #ddd; border-radius: 6px; flex: 1; font-weight: bold; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .msg { padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <a href="{% url 'staffs' %}?tab=users" class="back-link">&larr; Back to User Management</a>
    
    <h2>Edit: {{ user_to_edit.username }}</h2>

    {% if messages %}
        {% for m in messages %}
            <div class="msg" style="background: {% if m.tags == 'success' %}#d4edda{% else %}#f8d7da{% endif %};">
                {{ m }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="tab-buttons">
        <button type="button" class="tab-btn active" onclick="openTab(event, 'info')">Info</button>
        <button type="button" class="tab-btn" onclick="openTab(event, 'wallet')">Wallet</button>
        <button type="button" class="tab-btn" onclick="openTab(event, 'security')">Security</button>
    </div>

    <div id="info" class="tab-content active">
        <form method="post">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" value="{{ user_to_edit.username }}" required>
            <label>Order Progress</label>
            <input type="number" name="current_progress" value="{{ user_to_edit.profile.current_progress }}" required>
            <label>Phone</label>
            <input type="text" name="phone" value="{{ user_to_edit.profile.phone_number|default:'' }}">
            <button type="submit" name="update_info" class="btn" style="background:#3498db;">Save Info</button>
        </form>
    </div>

    <div id="wallet" class="tab-content">
        <form method="post">
            {% csrf_token %}
            <label>Network</label>
            <select name="network">
                <option value="ETH_USDC" {% if user_to_edit.profile.network == 'ETH_USDC' %}selected{% endif %}>ETH/USDC</option>
                <option value="TRX_USDT" {% if user_to_edit.profile.network == 'TRX_USDT' %}selected{% endif %}>TRX/USDT (TRC20)</option>
                <option value="BSC_USDT" {% if user_to_edit.profile.network == 'BSC_USDT' %}selected{% endif %}>BSC/USDT (BEP20)</option>
            </select>
            <label>Wallet Address</label>
            <input type="text" name="wallet_address" value="{{ user_to_edit.profile.wallet_address|default:'' }}">
            <button type="submit" name="update_wallet" class="btn" style="background:#e67e22;">Update Wallet & Network</button>
        </form>
    </div>

    <div id="security" class="tab-content">
        <form method="post">
            {% csrf_token %}
            {{ password_form.as_p }}
            <button type="submit" name="update_password" class="btn" style="background:#9b59b6;">Reset Password</button>
        </form>
    </div>
</div>

<script>
    function openTab(evt, name) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        evt.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
