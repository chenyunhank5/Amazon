<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Login | Secure Access</title>
</head>
<body style="margin:0; background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background: white; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 380px;">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="background: #2c3e50; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; color: white; font-size: 24px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                S
            </div>
            <h2 style="margin: 0; color: #2c3e50; font-size: 24px;">Staff Login</h2>
            <p style="color: #7f8c8d; font-size: 14px; margin-top: 8px;">Authorized Personnel Only</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div style="padding: 10px; background: #fff5f5; color: #c53030; border-radius: 8px; margin-bottom: 20px; font-size: 13px; text-align: center; border: 1px solid #feb2b2;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <style>
                /* Styling the Django form labels and inputs */
                p { margin-bottom: 20px; }
                label { display: block; font-size: 13px; font-weight: 600; color: #34495e; margin-bottom: 6px; }
                input { 
                    width: 100%; 
                    padding: 12px; 
                    border: 1px solid #dfe6e9; 
                    border-radius: 8px; 
                    box-sizing: border-box; 
                    font-size: 15px;
                    transition: all 0.2s;
                    background: #f8fafc;
                }
                input:focus { outline: none; border-color: #3498db; background: white; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1); }
                ul.errorlist { list-style: none; padding: 0; margin: 5px 0; font-size: 12px; color: #e74c3c; }
            </style>

            {{ form.as_p }}

            <button type="submit" style="width: 100%; background: #2c3e50; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: background 0.2s;">
                Enter Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
            <a href="{% url 'home' %}" style="color: #7f8c8d; text-decoration: none; font-size: 13px; font-weight: 500;">
                ← Back to Portal Selection
            </a>
        </div>
    </div>

</body>
</html>
