<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log New Order</title>
</head>
<body style="background: #f4f7f6; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    <div style="background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
        <h2 style="margin: 0 0 10px 0; color: #2c3e50; font-size: 24px;">Log New Order</h2>
        <p style="color: #7f8c8d; margin-bottom: 25px; font-size: 14px;">Profit is calculated automatically based on the rate.</p>
        
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; font-size: 14px;">Product Name</label>
                <input type="text" name="product_name" placeholder="e.g. Amazon Gift Card" required 
                    style="width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; font-size: 15px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; font-size: 14px;">Image URL</label>
                <input type="url" name="image_url" placeholder="https://example.com/image.jpg" 
                    style="width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; font-size: 15px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; font-size: 14px;">Order Price ($)</label>
                <input type="number" step="0.01" name="price" placeholder="0.00" required 
                    style="width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; font-size: 15px;">
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; font-size: 14px;">Commission Rate (%)</label>
                <input type="number" step="0.01" name="commission_rate" placeholder="e.g. 1.5" required 
                    style="width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; font-size: 15px;">
            </div>

            <button type="submit" style="width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
                Save Order to Logs
            </button>
            <a href="{% url 'staffs' %}" style="display: block; text-align: center; margin-top: 20px; color: #95a5a6; text-decoration: none; font-size: 14px;">&larr; Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
