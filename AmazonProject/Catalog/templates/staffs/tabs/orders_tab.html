<form method="GET" action="{% url 'staffs' %}" style="margin-bottom: 20px;">
    <input type="hidden" name="tab" value="templates">
    
    <div style="display: flex; gap: 8px;">
        <input type="text" name="template_search" placeholder="Search templates..." 
               value="{{ template_search_query }}" 
               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        <button type="submit" class="btn-sm btn-blue">Search</button>
    </div>
</form>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin:0;">Task Templates</h3>
    <a href="{% url 'add_order_staff' %}" class="btn-sm btn-balance">+ Create New Template</a>
</div>

<table style="width: 100%; border-collapse: collapse;">
    <thead>
        <tr>
            <th style="padding: 10px; border-bottom: 2px solid #e2e8f0; text-align: left;">Image</th>
            <th style="padding: 10px; border-bottom: 2px solid #e2e8f0; text-align: left;">Product Name</th>
            <th style="padding: 10px; border-bottom: 2px solid #e2e8f0; text-align: left;">Price</th>
            <th style="padding: 10px; border-bottom: 2px solid #e2e8f0; text-align: left;">Commission %</th>
            <th style="padding: 10px; border-bottom: 2px solid #e2e8f0; text-align: right;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for o in task_templates %}
        <tr>
            <td style="padding: 10px; border-bottom: 1px solid #f1f5f9;">
                {% if o.image_url %}
                    <a href="{{ o.image_url }}" target="_blank">
                        <img src="{{ o.image_url }}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd;">
                    </a>
                {% else %}
                    <div style="width: 40px; height: 40px; background: #f8fafc; border-radius: 6px; border: 1px dashed #ddd; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #94a3b8;">N/A</div>
                {% endif %}
            </td>
            <td style="padding: 10px; border-bottom: 1px solid #f1f5f9;">{{ o.product_name }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #f1f5f9;">${{ o.price }}</td>
            <td style="padding: 10px; border-bottom: 1px solid #f1f5f9; color:#3498db; font-weight:bold;">{{ o.commission_rate }}%</td>
            <td style="padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: right;">
                <a href="{% url 'edit_order_staff' o.id %}" class="btn-sm btn-blue">Edit</a>
                <form action="{% url 'delete_order_staff' o.id %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-sm btn-red" onclick="return confirm('Delete template?')">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5" style="text-align:center; padding: 20px; color:#94a3b8;">No templates found.</td></tr>
        {% endfor %}
    </tbody>
</table>
